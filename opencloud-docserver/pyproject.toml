[project]
name = "opencloud-docserver"
version = "0.1.0"
description = "Stoic Linux document server for OpenCloud (OCIS) WOPI integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-docx>=1.1",
    "python-jose[cryptography]>=3.3",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "lxml>=5.0",
    "jinja2>=3.1.6",
    "odfpy>=1.4",
    "weasyprint>=69.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: shells out to external tools (e.g. LibreOffice headless)",
    "flaky(reason, reruns=N): known environment flake — e2e conftest tags\n        browser tests dynamically; reruns need pytest-rerunfailures",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.uv]
package = false

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.12.0",
    "playwright>=1.40",
    "hypothesis>=6.165.10",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=16.6.1",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
]
