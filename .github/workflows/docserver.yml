name: Docserver

on:
  pull_request:
    paths:
      - "opencloud-docserver/**"
  push:
    branches: [main]
    paths:
      - "opencloud-docserver/**"

concurrency:
  group: docserver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + browser-e2e suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencloud-docserver
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: opencloud-docserver/uv.lock

      - name: Sync (frozen — dev group must carry all test deps)
        run: uv sync --frozen

      - name: Playwright browser (in-repo e2e uses chromium)
        run: uv run playwright install --with-deps chromium

      - name: Full suite (parallel; browser tests in their own lane; coverage gate)
        run: uv run --frozen pytest tests/ -q -n auto --dist loadgroup --cov=src --cov-report=term-missing:skip-covered

  register:
    name: Register gates (drift + full resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The register + harness live in wo-test-harness (moved out of this repo).
      # seed.py inventories THIS server checkout via WO_SERVER_DIR.
      - name: Check out wo-test-harness
        uses: actions/checkout@v4
        with:
          repository: World-Office/wo-test-harness
          path: wo-test-harness

      - name: Install PyYAML
        run: python3 -m pip install --break-system-packages pyyaml

      - name: Graph drift gate
        env:
          WO_SERVER_DIR: ${{ github.workspace }}
        run: python3 wo-test-harness/harness-graph/seed.py --check

      - name: Every feature covered or divergence-documented
        env:
          WO_SERVER_DIR: ${{ github.workspace }}
        run: |
          IDS=$(grep -oE 'F-[0-9]{3}' wo-test-harness/harness-graph/features.yaml | sort -u | tr '\n' ' ')
          python3 wo-test-harness/harness-graph/check-register.py $IDS

      - name: Unified test harness self-test (TH-001 gate)
        env:
          WO_SERVER_DIR: ${{ github.workspace }}
        run: bash wo-test-harness/tf-test-harness/test-harness.sh --self-test
